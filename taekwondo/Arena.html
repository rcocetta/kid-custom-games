<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taekwondo Master: arena review</title>
<style>
  body { margin: 0; background: #2E2A36; color: #fff; font-family: system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 12px 16px 4px; }
  p { margin: 0 16px 10px; font-size: 14px; opacity: .8; }
  #stage { position: relative; width: min(100vw, 1200px); margin: 0 auto; aspect-ratio: 1200 / 520; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<h1>Taekwondo Master: arena</h1>
<p>Grey silhouettes are 300 units tall, standing on floorY at minX+200 and maxX-200.</p>
<div id="stage"></div>
<script src="arena.js"></script>
<script>
  const A = window.TKDArena;
  const stage = document.getElementById('stage');
  const sil = (x) =>
    `<g fill="#6b6f7a" opacity=".85" transform="translate(${x} ${A.floorY})">` +
    `<circle cx="0" cy="-262" r="36"/><rect x="-34" y="-222" width="68" height="120" rx="26"/>` +
    `<rect x="-30" y="-110" width="24" height="110" rx="10"/><rect x="6" y="-110" width="24" height="110" rx="10"/></g>`;
  stage.innerHTML = A.arena();
  stage.insertAdjacentHTML('beforeend',
    `<svg viewBox="${A.viewBox}" preserveAspectRatio="xMidYMid meet">` +
    `<path d="M${A.minX} 0 V520 M${A.maxX} 0 V520" stroke="#fff" stroke-dasharray="6 8" opacity=".4"/>` +
    sil(A.minX + 200) + sil(A.maxX - 200) + `</svg>`);
</script>
</body>
</html>
